name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest

    # Postgres + Redis are required by the workspace's `#[sqlx::test]` and
    # Redis-backed integration tests under crates/gateway/tests/. The user
    # (`solvela`) is created as a superuser by the postgres image, which is
    # needed so sqlx::test can `CREATE DATABASE` for per-test isolation.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solvela
          POSTGRES_PASSWORD: solvela
          POSTGRES_DB: solvela_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solvela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c676846f29d98ff6b0106d3608c7ffd4048af17b  # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        env:
          DATABASE_URL: postgres://solvela:solvela@localhost:5432/solvela_test
          REDIS_URL: redis://localhost:6379
        run: cargo test --all

  coverage:
    name: Test coverage (informational)
    runs-on: ubuntu-latest
    # Non-blocking — informational output only. Reports scoped coverage
    # numbers to the workflow summary so we can pick a CI-enforced
    # threshold for the payment hot path with real data, not a guess.
    # Runs independently of `rust` to keep wall-clock low.
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solvela
          POSTGRES_PASSWORD: solvela
          POSTGRES_DB: solvela_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solvela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c676846f29d98ff6b0106d3608c7ffd4048af17b  # v2

      - name: Cache cargo-llvm-cov binary
        id: cache-cargo-llvm-cov
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          # Bump the version suffix here when you want a fresh install.
          key: ${{ runner.os }}-cargo-llvm-cov-0.6

      - name: Install cargo-llvm-cov
        if: steps.cache-cargo-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Collect coverage
        env:
          DATABASE_URL: postgres://solvela:solvela@localhost:5432/solvela_test
          REDIS_URL: redis://localhost:6379
        # Match the rust job's `cargo test --all` semantics — default features,
        # workspace scope. Escrow is not a workspace member (CLAUDE.md rule
        # #11), so it is intentionally excluded; cover it separately if/when
        # the threshold gate lands.
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Build scoped reports
        run: |
          set -euo pipefail

          # `crates/x402/`: payment protocol library — Solana verification,
          # escrow integration, fee payer, nonce pool. A regression here
          # means money loss.
          lcov --quiet --extract lcov.info '*/crates/x402/*' \
            --output-file lcov-x402.info

          # Gateway payment hot path: `routes/chat/**` (cost calc, payment
          # extraction, provider proxy) and `middleware/x402.rs` (header
          # decode, replay protection, verifier dispatch).
          lcov --quiet --extract lcov.info \
            '*/crates/gateway/src/routes/chat/*' \
            '*/crates/gateway/src/middleware/x402.rs' \
            --output-file lcov-payment.info

          summary() {
            # `lcov --summary` writes the percentages to stderr; merge with
            # `2>&1` and grep just the lines/functions rows we care about.
            lcov --summary "$1" 2>&1 | grep -E '^\s+(lines|functions)' || true
          }

          {
            echo "## Test coverage (informational, non-blocking)"
            echo ""
            echo "Scoped to payment-critical code. Use these numbers to pick a CI-enforced threshold before flipping the gate to required."
            echo ""
            echo "### Workspace overall"
            echo '```'
            summary lcov.info
            echo '```'
            echo ""
            echo "### \`crates/x402/\` — protocol library (verification, escrow, fee payer, nonce)"
            echo '```'
            summary lcov-x402.info
            echo '```'
            echo ""
            echo "### Gateway payment hot path — \`routes/chat/**\` + \`middleware/x402.rs\`"
            echo '```'
            summary lcov-payment.info
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-lcov
          path: |
            lcov.info
            lcov-x402.info
            lcov-payment.info
          retention-days: 14

  deny:
    name: Dependency hygiene (cargo-deny)
    runs-on: ubuntu-latest
    # Checks licenses, sources, advisories (RustSec), and dependency-graph
    # bans against deny.toml. Runs independently — parallel with rust/audit.
    # Source of truth for policy is deny.toml; this job is just the runner.

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Cache cargo-deny binary
        id: cache-cargo-deny
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cargo/bin/cargo-deny
          # Bump the version suffix here when you want a fresh install.
          key: ${{ runner.os }}-cargo-deny-0.19

      - name: Install Rust toolchain
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Install cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked

      - name: Run cargo deny check
        run: cargo deny check

  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    # Runs independently — no `needs:` — parallel with the rust job

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Get current date (for advisory-db cache key)
        id: date
        run: echo "date=$(date -u '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cargo/bin/cargo-audit
          # Key includes the tool version so the cache is invalidated on upgrades.
          # Bump the version suffix here when you want a fresh install.
          key: ${{ runner.os }}-cargo-audit-0.21

      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: Cache advisory-db
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cargo/advisory-db
          # Daily key so the DB is refreshed at most once per day per runner OS.
          # `restore-keys` lets a slightly stale cache be used and cargo-audit
          # will do an incremental git-fetch on top of it.
          key: ${{ runner.os }}-advisory-db-${{ steps.date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-advisory-db-

      - name: Run cargo audit
        # RUSTSEC-2023-0071 (Marvin timing sidechannel in `rsa` 0.9.x): no
        # fixed upstream version exists. The `rsa` crate is transitive via
        # `sqlx-mysql` only, and Solvela uses Postgres (`sqlx-postgres`) —
        # the vulnerable code path is never reached. Re-evaluate when `rsa`
        # ships a fix or `sqlx` drops the unused mysql/rsa transitive.
        run: cargo audit --ignore RUSTSEC-2023-0071

  smoke-test:
    name: Smoke test (boot gateway + curl endpoints)
    runs-on: ubuntu-latest
    needs: rust

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solvela
          POSTGRES_PASSWORD: solvela
          POSTGRES_DB: solvela_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solvela"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c676846f29d98ff6b0106d3608c7ffd4048af17b  # v2

      - name: Build gateway (release)
        run: cargo build --release -p gateway

      - name: Start gateway
        run: |
          DATABASE_URL="postgres://solvela:solvela@localhost:5432/solvela_test" \
          REDIS_URL="redis://localhost:6379" \
          SOLVELA_DEV_BYPASS_PAYMENT=true \
          SOLVELA_ADMIN_TOKEN=ci-test-token \
          RUST_LOG=gateway=info \
          ./target/release/solvela-gateway &
          echo "GATEWAY_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for gateway to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8402/health > /dev/null 2>&1; then
              echo "Gateway healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Gateway failed to start within 30s"
          exit 1

      - name: Run smoke tests
        run: |
          set -euo pipefail
          BASE="http://localhost:8402"
          PASS=0
          FAIL=0

          check() {
            local name="$1"
            shift
            if "$@"; then
              echo "PASS: $name"
              PASS=$((PASS + 1))
            else
              echo "FAIL: $name"
              FAIL=$((FAIL + 1))
            fi
          }

          # 1. GET /health → 200
          check "GET /health returns 200" \
            curl -sf "$BASE/health" -o /dev/null -w '' --fail

          # 2. GET /v1/models → 200, body contains "data"
          check "GET /v1/models returns 200 with data" \
            bash -c 'curl -sf "$0/v1/models" | grep -q "\"data\""' "$BASE"

          # 3. POST /v1/chat/completions → 402 or 500 (no payment header, bypass
          #    enabled but no provider API keys means FallbackProvider responds)
          check "POST /v1/chat/completions returns expected status" \
            bash -c '
              status=$(curl -s -o /dev/null -w "%{http_code}" \
                -X POST "$0/v1/chat/completions" \
                -H "Content-Type: application/json" \
                -d "{\"model\":\"openai-gpt-4o\",\"messages\":[{\"role\":\"user\",\"content\":\"hello\"}]}")
              echo "  status=$status"
              [ "$status" = "402" ] || [ "$status" = "500" ] || [ "$status" = "200" ]
            ' "$BASE"

          # 4. GET /metrics with admin token → 200, body contains "solvela_requests_total"
          check "GET /metrics with admin token returns metrics" \
            bash -c '
              body=$(curl -sf "$0/metrics" -H "Authorization: Bearer ci-test-token")
              echo "$body" | grep -q "solvela_requests_total"
            ' "$BASE"

          # 5. POST /v1/chat/completions with X-Solvela-Debug: true → x-solvela-request-id header present
          check "X-Solvela-Debug returns x-solvela-request-id header" \
            bash -c '
              headers=$(curl -sD - -o /dev/null \
                -X POST "$0/v1/chat/completions" \
                -H "Content-Type: application/json" \
                -H "X-Solvela-Debug: true" \
                -d "{\"model\":\"openai-gpt-4o\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}")
              echo "$headers" | grep -qi "x-solvela-request-id"
            ' "$BASE"

          # 6. POST with X-Request-Id → echoed back
          check "X-Request-Id is echoed back" \
            bash -c '
              headers=$(curl -sD - -o /dev/null \
                -X POST "$0/v1/chat/completions" \
                -H "Content-Type: application/json" \
                -H "X-Request-Id: ci-test-123" \
                -d "{\"model\":\"openai-gpt-4o\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}")
              echo "$headers" | grep -q "ci-test-123"
            ' "$BASE"

          # 7. Send 5 rapid requests → rate limit headers present
          check "Rate limit headers present after rapid requests" \
            bash -c '
              for i in 1 2 3 4 5; do
                curl -s -o /dev/null \
                  -X POST "$0/v1/chat/completions" \
                  -H "Content-Type: application/json" \
                  -d "{\"model\":\"openai-gpt-4o\",\"messages\":[{\"role\":\"user\",\"content\":\"test $i\"}]}"
              done
              headers=$(curl -sD - -o /dev/null \
                -X POST "$0/v1/chat/completions" \
                -H "Content-Type: application/json" \
                -d "{\"model\":\"openai-gpt-4o\",\"messages\":[{\"role\":\"user\",\"content\":\"test 6\"}]}")
              echo "$headers" | grep -qi "x-ratelimit-limit"
            ' "$BASE"

          # 8. GET /v1/models exposes every corrected Anthropic model ID.
          #    Catches registry collapses (two entries sharing a canonical
          #    provider/model_id dedupe to one in /v1/models) and model_id
          #    typos. See PR #358 — the prior duplicate sonnet entries would
          #    have made one of these IDs absent here.
          check "GET /v1/models exposes all Anthropic model IDs" \
            bash -c '
              body=$(curl -sf "$0/v1/models")
              for id in \
                "anthropic/claude-opus-4-6" \
                "anthropic/claude-sonnet-4-6" \
                "anthropic/claude-sonnet-4-5-20250929" \
                "anthropic/claude-haiku-4-5-20251001"; do
                if ! echo "$body" | grep -q "\"$id\""; then
                  echo "  missing from /v1/models: $id"
                  exit 1
                fi
              done
            ' "$BASE"

          # 9. Anthropic aliases resolve through the full HTTP path. A 404
          #    (model_not_found) means the alias points at a model the
          #    registry does not contain — the alias↔registry drift class.
          #    Any non-404 (200 stub, 402, 429) means resolution succeeded.
          check "Anthropic aliases resolve (not 404)" \
            bash -c '
              for alias in opus sonnet sonnet4.5 haiku; do
                status=$(curl -s -o /dev/null -w "%{http_code}" \
                  -X POST "$0/v1/chat/completions" \
                  -H "Content-Type: application/json" \
                  -d "{\"model\":\"$alias\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}")
                echo "  $alias -> $status"
                if [ "$status" = "404" ]; then
                  echo "  alias $alias did not resolve (model_not_found)"
                  exit 1
                fi
              done
            ' "$BASE"

          echo ""
          echo "Results: $PASS passed, $FAIL failed"
          [ "$FAIL" -eq 0 ]

      - name: Stop gateway
        if: always()
        run: |
          if [ -n "${GATEWAY_PID:-}" ]; then
            kill "$GATEWAY_PID" 2>/dev/null || true
            wait "$GATEWAY_PID" 2>/dev/null || true
          fi

  semantic-cache:
    name: Semantic cache (redis-stack + embedding model)
    runs-on: ubuntu-latest
    # The main `rust` job uses plain `redis:7`, which lacks the RediSearch
    # module, so every semantic-cache test skips gracefully there (see the
    # `try_semantic_cache` / `fresh_cache` / `embedder` guards). This job
    # provides redis-stack (RediSearch) AND the bge-small embedding model so
    # those tests actually execute — without it, the Tier-2 read/write path,
    # the discount pricing, and the write-back regression test are never
    # exercised in CI. Blocking and green from day one: the only external
    # dependency is the one-time model download, which is cached below.

    services:
      redis-stack:
        image: redis/redis-stack-server:7.4.0-v3
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c676846f29d98ff6b0106d3608c7ffd4048af17b  # v2

      - name: Cache embedding model
        # bge-small-en-v1.5 (~133 MB) is downloaded from the Hugging Face hub by
        # `fastembed` on first run, then reused. Caching it keeps the job fast
        # and resilient to hub hiccups. Path matches the workspace-root dir the
        # tests resolve via `CARGO_MANIFEST_DIR/../../.fastembed_cache`.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: .fastembed_cache
          # Bump the suffix to force a fresh model download.
          key: ${{ runner.os }}-fastembed-bge-small-en-v15-v1

      - name: Run semantic-cache tests
        env:
          REDIS_URL: redis://localhost:6379
        # Scope to the cache module + the semantic integration tests. The first
        # invocation populates `.fastembed_cache` (downloading the model if the
        # cache missed); both then run against live redis-stack.
        run: |
          cargo test -p gateway --lib cache::
          cargo test -p gateway --test integration semantic

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: rust

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          push: false
          tags: solvela:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
