# Auto-approve a PR once all required checks on `main` are green.
#
# Why this exists: branch protection on `main` requires 1 approving review,
# but Solvela is a solo-maintainer repo with no second human reviewer — so
# every green PR otherwise needs a manual approve-as-bot step. This posts that
# approval automatically (as `github-actions[bot]`) so the PR becomes
# mergeable.
#
# Auto-merge: PRs from the bot authors in MERGE_ALLOW (dependabot and the
# `sky64-agent` maintenance agent) are also squash-merged here once approved,
# unless they touch the money path or bump a money-path dependency
# (MONEY_DEPS). Everyone else's PRs, including the maintainer's, still merge
# by hand. The merge uses this job's GITHUB_TOKEN, and pushes made with that
# token do not trigger other workflows: a bot merge does NOT run `deploy.yml`.
# Production only moves when a human merges or deploys.
#
# Security posture: this makes CI the effective gate to `main`. The guards
# below keep the blast radius to first-party, non-fork PRs from a small author
# allowlist. `required_conversation_resolution` on `main` still independently
# blocks merge until review threads are resolved.
#
# Prerequisite (already enabled via API at creation time): org + repo setting
# "Allow GitHub Actions to create and approve pull requests" must be ON, else
# createReview returns 422.
#
# Trigger: `workflow_run` on the CI and DCO workflows — NOT `check_suite`.
# A `check_suite` whose checks were created by Actions' own GITHUB_TOKEN does
# not re-trigger a `check_suite` workflow (GitHub's recursion guard), so the
# previous trigger only ever fired for non-PR suites on `main` and never
# evaluated open PR branches — leaving green PRs unapproved. `workflow_run`
# fires reliably after each listed workflow completes, on the PR head SHA, and
# runs the trusted default-branch copy of this file. Together CI + DCO produce
# every check in REQUIRED below; the script re-verifies the full set for the
# SHA, so whichever workflow finishes last is the one that approves.
name: Auto-approve on green CI

on:
  workflow_run:
    workflows: [CI, DCO]
    types: [completed]

permissions:
  pull-requests: write
  checks: read
  contents: write  # squash-merge of MERGE_ALLOW PRs

jobs:
  approve:
    # Only bother when the triggering workflow succeeded; the script
    # re-verifies every required check regardless.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.workflow_run.head_sha;

            // KEEP IN SYNC with branch protection required checks on `main`.
            // Adding/renaming a required check without updating this list
            // would let the bot approve on an incomplete set.
            const REQUIRED = [
              'Rust (fmt, clippy, test)',
              'Smoke test (boot gateway + curl endpoints)',
              'Security audit (cargo-audit)',
              'Dependency hygiene (cargo-deny)',
              'Docker build',
              'Verify DCO sign-off on every commit',
              'Semantic cache (redis-stack + embedding model)',
              'Secret scan (gitleaks)',
            ];
            // Authors whose green PRs may be auto-approved. `dependabot[bot]`
            // is included so routine dependency bumps clear review on green CI
            // without a manual approve-as-bot step. This is safe because every
            // other guard still applies: dependabot pushes to a same-repo branch
            // (passes the no-fork check), the money-path exclusion below still
            // blocks any bump that touches fund-moving code, and the full
            // REQUIRED set must be green. Merge is decided separately below
            // (MERGE_ALLOW / MONEY_DEPS).
            // `sky64-agent` is the dsh-superagent maintenance bot; its PRs get
            // the same guards as dependabot's.
            const ALLOW = ['sky64', 'dependabot[bot]', 'sky64-agent'];
            // Authors whose approved PRs are also merged automatically. Not the
            // maintainer: their PRs stay a deliberate manual merge.
            const MERGE_ALLOW = ['dependabot[bot]', 'sky64-agent'];
            // Dependency bumps that never auto-merge (approval is unaffected).
            // MONEY_PATH matches file paths, but a bump of a crypto or Solana
            // crate only changes manifests and lockfiles, so match package
            // names instead: the PR title, plus the package table dependabot
            // writes for grouped bumps (not its release notes, which mention
            // words like "anchors" and "base58" in passing).
            const MONEY_DEPS = /\b(solana|spl-|anchor|dalek|ed25519|curve25519|x25519|tweetnacl|bs58|base58|signer-core|x402)|@solana\/|@coral-xyz\//i;

            // Money-path surfaces: code that signs / verifies / settles payments,
            // computes cost, touches escrow / USDC, or handles secret key material
            // (wallets / keypairs / signers). A PR touching ANY of these is NOT
            // auto-approved — it requires a human review even on green CI, because
            // here CI is not a sufficient gate (funds move, or keys are at risk).
            const MONEY_PATH = [
              /^crates\/x402\//,
              /^crates\/escrow-tx\//,
              /^programs\/escrow\//,
              /^crates\/protocol\/src\/(payment|settlement|cost|constants)\.rs$/,
              /^crates\/gateway\/src\/routes\/chat\//,        // whole paid pipeline (mod/cost/payment/provider/response)
              /^crates\/gateway\/src\/middleware\/(x402|rate_limit)\.rs$/, // payment decode/replay gate + payer-keyed rate limit
              /^crates\/gateway\/src\/escrow\//,
              /^crates\/gateway\/src\/a2a\//,
              /^crates\/gateway\/src\/usage\.rs$/,
              /(^|\/)signer\.(rs|ts|py|go)$/, // per-language SDK signing modules
              /^sdks\/signer-core\//,         // shared cross-language signer pkg (sign/scheme-filter/stub-guard fall through signer.* above)
              /(^|\/)(wallet|keypair)[\w-]*\.(rs|ts|py|go)$/, // wallet/keypair modules that load/create/hold secret keys (e.g. sdks/mcp/src/wallet.ts, missed on #577)
              /(^|\/)adapters\/local\.ts$/,   // dev/test local wallet adapter — decodes raw secret-key bytes
              /^sdks\/.*\/escrow/,            // SDK escrow paths
            ];

            const prs = (await github.rest.repos.listPullRequestsAssociatedWithCommit(
              { owner, repo, commit_sha: sha })).data;

            for (const pr of prs) {
              // --- guards ---
              if (pr.state !== 'open' || pr.draft) continue;
              if (pr.base.ref !== 'main') continue;
              if (pr.head.repo.full_name !== pr.base.repo.full_name) continue; // no forks
              if (!ALLOW.includes(pr.user.login)) continue;

              // --- money-path exclusion: never auto-approve; needs human review ---
              const files = await github.paginate(github.rest.pulls.listFiles,
                { owner, repo, pull_number: pr.number, per_page: 100 });
              const moneyHit = files.find(f => MONEY_PATH.some(re => re.test(f.filename)));
              if (moneyHit) {
                core.notice(`PR #${pr.number} touches money-path (${moneyHit.filename}); `
                  + 'skipping auto-approve — human review required');
                continue;
              }

              // --- all required checks green for this exact SHA ---
              const runs = await github.paginate(github.rest.checks.listForRef,
                { owner, repo, ref: sha, per_page: 100 });
              const conclusion = {};
              for (const r of runs) conclusion[r.name] = r.conclusion;
              if (!REQUIRED.every(n => conclusion[n] === 'success')) continue;

              // --- don't approve over a CHANGES_REQUESTED review; idempotent ---
              const reviews = await github.paginate(github.rest.pulls.listReviews,
                { owner, repo, pull_number: pr.number });
              if (reviews.some(r => r.state === 'CHANGES_REQUESTED')) continue;
              const alreadyApproved = reviews.some(r =>
                r.state === 'APPROVED'
                && r.user.login === 'github-actions[bot]'
                && r.commit_id === sha);
              const packages = [...(pr.body || '').matchAll(/^\| \[([^\]]+)\]/gm)]
                .map(m => m[1]).join(' ');
              const autoMerge = MERGE_ALLOW.includes(pr.user.login)
                && !MONEY_DEPS.test(`${pr.title} ${packages}`);

              if (!alreadyApproved) {
                await github.rest.pulls.createReview({
                  owner, repo, pull_number: pr.number, event: 'APPROVE',
                  body: 'Auto-approved: all required checks green for '
                      + `\`${sha.slice(0, 7)}\`. CI is the gate; `
                      + 'conversation-resolution still enforced. '
                      + (autoMerge ? 'Auto-merging (no deploy).' : 'Merge is manual.'),
                });
                core.notice(`Auto-approved PR #${pr.number} at ${sha}`);
              }
              if (!autoMerge) continue;

              // sha pins the merge to the commit whose checks were verified;
              // a newer push makes GitHub refuse it, and that push's own
              // workflow_run re-evaluates.
              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: pr.number, sha, merge_method: 'squash',
                });
                core.notice(`Auto-merged PR #${pr.number} at ${sha}`);
              } catch (e) {
                // Unresolved conversations, a conflict or a race: leave it open.
                core.warning(`Could not auto-merge PR #${pr.number}: ${e.message}`);
              }
            }
