name: sdk-python publish

# Tag-triggered publish for the Python payment SDK at sdks/python/.
#
# solvela-sdk ships a client that signs and broadcasts real USDC-SPL
# transactions on Solana mainnet, so every guardrail in the
# payment-sdk-publisher charter applies:
#   - a `test` job that re-runs the SDK's CI command set at the tagged
#     commit, and fails fast if the tag version != pyproject version
#   - a `build` job that produces the sdist+wheel and runs `twine check`
#     BEFORE any upload
#   - a `publish` job in the dedicated `pypi-publish` environment that
#     uploads via PyPI Trusted Publishing (OIDC) — NO static token
#   - a `verify` job that polls the PyPI JSON API until the new version
#     is visible, then asserts the Apache-2.0 license metadata and
#     compares the registry sdist sha256 against the locally-built one
#
# Authoring provenance (cite tool versions so a future maintainer can
# tell correct-at-the-time guidance from speculation):
#   - Verified locally 2026-06-12 against Python 3.12.3, build 1.x,
#     twine 6.x: `pip install -e ".[dev]"` + ruff/mypy/pytest (250 tests),
#     `python -m build`, `twine check dist/*` all pass on version 0.3.0.
#   - PyPI Trusted Publishing requires NO token. The publish action
#     `pypa/gh-action-pypi-publish` resolves the OIDC token from the
#     job's `id-token: write` permission. PEP 740 attestations are
#     generated by default for trusted-publishing flows (action v1.11+).
#     Source: https://github.com/pypa/gh-action-pypi-publish/blob/release/v1/README.md
#   - Mirrors the shape of .github/workflows/sdk-typescript-publish.yml
#     (tag-trigger, concurrency, environment, post-publish visibility
#     poll + sha verify) and sdk-rust-publish.yml (tag-vs-manifest
#     verify-first, JSON-API visibility loop).
#
# OPERATOR PREREQUISITE (must be done ONCE before the first tag):
#   Configure a PyPI Trusted Publisher for the `solvela-sdk` project at
#   https://pypi.org/manage/project/solvela-sdk/settings/publishing/
#   (or the pending-publisher form if the project is being re-claimed)
#   with EXACTLY these values:
#     Owner:                  solvela-ai
#     Repository:             solvela
#     Workflow filename:      sdk-python-publish.yml
#     Environment name:       pypi-publish
#   Until that publisher exists, the publish job will fail with an OIDC
#   "no trusted publisher" error. There is no token fallback — that is
#   the intended fail-closed behavior, not a workflow bug.

on:
  push:
    tags:
      - 'sdks/python/v*'

# Never cancel a publish mid-run. A cancelled publish can leave the
# registry in a partial state.
concurrency:
  group: sdk-python-publish-${{ github.ref }}
  cancel-in-progress: false

# Least privilege at the workflow root; the publish job escalates to
# id-token: write per-job (required for Trusted Publishing OIDC).
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------
  # Re-run the SDK's CI command set at the tagged commit AND enforce
  # tag-vs-manifest version equality. sdk-rust-publish.yml and
  # sdk-typescript-publish.yml both fail fast on tag/version drift; the
  # Python pipeline does the same. The version check runs BEFORE the
  # test matrix so a mistagged commit halts in seconds, not after a
  # full matrix run.
  #
  # The lint/type/test commands are copied VERBATIM from
  # .github/workflows/sdks-python.yml (do not invent commands), down to
  # the Python matrix (3.10 oldest-supported + 3.12 current) and the
  # pip cache config.
  # --------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - name: Checkout (full history so tag is reachable)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Verify tag matches pyproject version
        run: |
          set -euo pipefail
          # Tag format: sdks/python/v0.3.0  ->  TAG_VERSION=0.3.0
          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_NAME#sdks/python/v}"
          if [ "$TAG_VERSION" = "$TAG_NAME" ]; then
            echo "ERROR: tag '$TAG_NAME' does not match expected pattern 'sdks/python/v<version>'"
            exit 1
          fi

          # Extract version from [project] in pyproject.toml. Match the
          # first `version = "..."` line inside the [project] table only,
          # so a `version = "..."` inside another table (e.g. a tool
          # config) can never be mistaken for the package version.
          MANIFEST_VERSION=$(awk '
            /^\[project\]/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && /^version[[:space:]]*=/ {
              if (match($0, /"[^"]*"/) > 0) {
                print substr($0, RSTART + 1, RLENGTH - 2)
                exit
              }
            }
          ' pyproject.toml)

          if [ -z "$MANIFEST_VERSION" ]; then
            echo "ERROR: failed to extract version from sdks/python/pyproject.toml [project]"
            exit 1
          fi

          echo "Tag version:      $TAG_VERSION"
          echo "Manifest version: $MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: tag version ($TAG_VERSION) != pyproject version ($MANIFEST_VERSION)"
            echo "Bump sdks/python/pyproject.toml or retag at the correct commit."
            exit 1
          fi

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml

      # The next four steps are copied verbatim from sdks-python.yml so
      # the publish gate exercises exactly what PR CI exercised — no
      # silent downgrade of the test surface.
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy src/
      - run: pytest tests/unit/ tests/integration/ -v --tb=short

  # --------------------------------------------------------------------
  # Build the sdist+wheel and run twine check BEFORE any upload. The
  # built artifact is uploaded so the publish job uploads the EXACT same
  # bytes that twine check validated (no rebuild between check and
  # publish). A single build also lets the verify job sha256-compare the
  # registry sdist against this artifact.
  # --------------------------------------------------------------------
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: '3.12'

      - name: Install build + twine
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: twine check
        run: twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-dist
          path: sdks/python/dist/
          if-no-files-found: error

  # --------------------------------------------------------------------
  # Publish to PyPI via Trusted Publishing (OIDC). NO token: the action
  # mints a short-lived OIDC token from the job's id-token permission and
  # exchanges it with PyPI for an upload token scoped to this project.
  # Runs in the `pypi-publish` environment so the trusted-publisher
  # config (which pins the environment name) matches.
  # --------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi-publish
      url: https://pypi.org/p/solvela-sdk
    permissions:
      id-token: write  # MANDATORY for Trusted Publishing; do not remove.
      contents: read
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-dist
          path: dist/

      # Trusted Publishing: no `password`/`user` inputs. packages-dir is
      # set explicitly (the action default is dist/, but we name it so a
      # future working-directory change can't silently point it elsewhere).
      # PEP 740 attestations are generated by default for OIDC flows.
      - name: Publish to PyPI (Trusted Publishing, OIDC)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          packages-dir: dist/

  # --------------------------------------------------------------------
  # Post-publish verification. Poll the PyPI JSON API until the new
  # version surfaces (PyPI's read path can lag the upload — the TS
  # workflow went red on exactly this propagation race, fixed in #551 by
  # baking in a 30x10s poll). Then assert the version's license metadata
  # shows Apache-2.0 and sha256-compare the registry sdist against the
  # locally-built artifact.
  # --------------------------------------------------------------------
  verify:
    name: Verify published artifact
    runs-on: ubuntu-latest
    needs: [build, publish]
    steps:
      - name: Download built dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-dist
          path: dist/

      - name: Poll PyPI, assert license, compare sdist sha256
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#sdks/python/v}"
          echo "Verifying solvela-sdk==${VERSION}"

          # Poll the JSON API until the version appears (30 x 10s = ~5 min).
          RELEASE_JSON=""
          for i in $(seq 1 30); do
            HTTP=$(curl -sS -o /tmp/pypi.json -w "%{http_code}" \
              -H "User-Agent: solvela-publish-ci" \
              --max-time 30 \
              "https://pypi.org/pypi/solvela-sdk/${VERSION}/json" || echo "000")
            if [ "$HTTP" = "200" ]; then
              RELEASE_JSON=$(cat /tmp/pypi.json)
              echo "Attempt $i/30: solvela-sdk==${VERSION} is visible on PyPI"
              break
            fi
            echo "Attempt $i/30: solvela-sdk==${VERSION} not visible yet (HTTP $HTTP); sleeping 10s"
            sleep 10
          done
          if [ -z "$RELEASE_JSON" ]; then
            echo "ERROR: solvela-sdk==${VERSION} not visible on PyPI after ~5 minutes"
            exit 1
          fi

          # Assert Apache-2.0 via license_expression (PEP 639) with a
          # classifier fallback for older metadata. Fail loudly if the
          # published license is not Apache-2.0 — a license regression on
          # a payment SDK is a release-blocking defect.
          python3 - "$VERSION" <<'PY'
          import json, sys
          version = sys.argv[1]
          data = json.load(open("/tmp/pypi.json"))
          info = data.get("info", {})
          lic_expr = (info.get("license_expression") or "").strip()
          classifiers = info.get("classifiers") or []
          apache_classifier = "License :: OSI Approved :: Apache Software License"
          ok = lic_expr == "Apache-2.0" or apache_classifier in classifiers
          print(f"license_expression: {lic_expr!r}")
          print(f"apache classifier present: {apache_classifier in classifiers}")
          if not ok:
              print(f"ERROR: solvela-sdk=={version} is not Apache-2.0 on PyPI")
              sys.exit(1)
          print("License check passed: Apache-2.0")
          PY

          # sha256-compare the registry sdist against the locally-built
          # one. PyPI publishes the per-file sha256 in the JSON API, so
          # we compare digests directly (no re-download of the wheel
          # needed; we still fetch the sdist to be belt-and-braces).
          LOCAL_SDIST="dist/solvela_sdk-${VERSION}.tar.gz"
          if [ ! -f "$LOCAL_SDIST" ]; then
            echo "ERROR: expected local sdist $LOCAL_SDIST not found in artifact"
            exit 1
          fi
          LOCAL_SHA=$(sha256sum "$LOCAL_SDIST" | awk '{print $1}')
          echo "Local sdist sha256:    $LOCAL_SHA"

          REGISTRY_SHA=$(python3 - "$VERSION" <<'PY'
          import json, sys
          version = sys.argv[1]
          data = json.load(open("/tmp/pypi.json"))
          target = f"solvela_sdk-{version}.tar.gz"
          for f in data.get("urls", []):
              if f.get("filename") == target and f.get("packagetype") == "sdist":
                  print(f["digests"]["sha256"])
                  break
          PY
          )
          if [ -z "$REGISTRY_SHA" ]; then
            echo "ERROR: could not find sdist sha256 for solvela_sdk-${VERSION}.tar.gz in PyPI JSON"
            exit 1
          fi
          echo "Registry sdist sha256: $REGISTRY_SHA"

          if [ "$LOCAL_SHA" != "$REGISTRY_SHA" ]; then
            echo "ERROR: sdist sha256 mismatch! Local=$LOCAL_SHA Registry=$REGISTRY_SHA"
            echo "The bytes on PyPI differ from what this run built — investigate before trusting the release."
            exit 1
          fi
          echo "sdist sha256 match confirmed — published artifact integrity verified."
