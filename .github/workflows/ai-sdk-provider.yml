name: ai-sdk-provider

on:
  push:
    paths:
      - 'sdks/ai-sdk-provider/**'
      - 'sdks/signer-core/**'
      # Wire-format types in `crates/protocol/` are hand-mirrored by the
      # TS SDK. A change here doesn't directly run the SDK, but re-running
      # SDK CI is the cheapest way to flag "did anyone update the SDK
      # side?". Proper end-to-end wire-compat verification needs SDK
      # tests against a live gateway — tracked separately.
      - 'crates/protocol/**'
      # The generated model registry (src/generated/models.ts) is derived from
      # config/models.toml. Trigger here so the models-fresh job catches a TOML
      # change that wasn't followed by `npm run generate-models`.
      - 'config/models.toml'
      - '.github/workflows/ai-sdk-provider.yml'
  pull_request:
    paths:
      - 'sdks/ai-sdk-provider/**'
      - 'sdks/signer-core/**'
      - 'crates/protocol/**'
      - 'config/models.toml'
      - '.github/workflows/ai-sdk-provider.yml'

defaults:
  run:
    working-directory: sdks/ai-sdk-provider

jobs:
  docs-key-leak-check:
    name: Docs key-leak check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/ai-sdk-provider/package-lock.json
      - name: "Build signer-core dist/ (file: dep — npm doesn't auto-build)"
        working-directory: sdks/signer-core
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run check:docs

  install:
    name: Install (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: docs-key-leak-check
    strategy:
      matrix:
        # Node 20 dropped: undici 8 (devDep, mocks integration-test transport
        # via MockAgent) requires engines.node >= 22.19. Node 20 went EOL
        # April 2026; Node 22 is the current LTS. Runtime code (sign.ts)
        # only needs Node 14+; engines.node in package.json remains
        # permissive for consumers (undici is dev-only).
        node: ['22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/ai-sdk-provider/package-lock.json
      - name: "Build signer-core dist/ (file: dep — npm doesn't auto-build)"
        working-directory: sdks/signer-core
        run: npm ci && npm run build
      - run: npm ci

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/ai-sdk-provider/package-lock.json
      - name: "Build signer-core dist/ (file: dep — npm doesn't auto-build)"
        working-directory: sdks/signer-core
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/ai-sdk-provider/package-lock.json
      - name: "Build signer-core dist/ (file: dep — npm doesn't auto-build)"
        working-directory: sdks/signer-core
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run lint

  test-unit:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        # Node 20 dropped: undici 8 (devDep, mocks integration-test transport
        # via MockAgent) requires engines.node >= 22.19. Node 20 went EOL
        # April 2026; Node 22 is the current LTS. Runtime code (sign.ts)
        # only needs Node 14+; engines.node in package.json remains
        # permissive for consumers (undici is dev-only).
        node: ['22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/ai-sdk-provider/package-lock.json
      - name: "Build signer-core dist/ (file: dep — npm doesn't auto-build)"
        working-directory: sdks/signer-core
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run test:unit

  test-integration:
    name: Integration tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        # Node 20 dropped: undici 8 (devDep, mocks integration-test transport
        # via MockAgent) requires engines.node >= 22.19. Node 20 went EOL
        # April 2026; Node 22 is the current LTS. Runtime code (sign.ts)
        # only needs Node 14+; engines.node in package.json remains
        # permissive for consumers (undici is dev-only).
        node: ['22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/ai-sdk-provider/package-lock.json
      - name: "Build signer-core dist/ (file: dep — npm doesn't auto-build)"
        working-directory: sdks/signer-core
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run test:integration

  size:
    name: Bundle size check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/ai-sdk-provider/package-lock.json
      - name: "Build signer-core dist/ (file: dep — npm doesn't auto-build)"
        working-directory: sdks/signer-core
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run build
      - run: npm run size

  guard-install-scripts:
    name: Guard install scripts
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/ai-sdk-provider/package-lock.json
      - name: "Build signer-core dist/ (file: dep — npm doesn't auto-build)"
        working-directory: sdks/signer-core
        run: npm ci && npm run build
      - run: npm ci
      - name: Fail if any dependency has postinstall/preinstall/prepublish
        run: |
          SCRIPTS=$(npm ls --all --json 2>/dev/null | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          def check(node, path=''):
              scripts = node.get('scripts', {})
              bad = [s for s in ['postinstall','preinstall','prepublish'] if s in scripts]
              if bad:
                  print(f'{path}: {bad}')
              for name, child in node.get('dependencies', {}).items():
                  check(child, name)
          check(data)
          ")
          if [ -n "$SCRIPTS" ]; then
            echo "ERROR: unexpected install scripts found:"
            echo "$SCRIPTS"
            exit 1
          fi
          echo "OK: no unexpected install scripts"

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/ai-sdk-provider/package-lock.json
      - name: "Build signer-core dist/ (file: dep — npm doesn't auto-build)"
        working-directory: sdks/signer-core
        run: npm ci && npm run build
      - run: npm ci
      # Audit-level critical (not high) because @solana/spl-token transitively
      # pulls bigint-buffer, which has a known high-severity CVE
      # (GHSA-3gc7-fjrx-p6mg) with no upstream fix. Affects the entire Solana
      # ecosystem. Dependabot security alerts cover the high-severity gap on
      # the repo level; this job catches CRITICAL regressions in CI.
      # Mirrors openclaw-provider.yml; signer-core's bs58/web3.js/spl-token
      # hard-deps reach this audit via signer-core's node_modules after
      # `npm ci` here builds it as a file: dep above.
      - run: npm audit --production --audit-level=critical

  models-fresh:
    name: Generated models up to date
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdks/ai-sdk-provider/package-lock.json
      - run: npm ci
      # src/generated/models.ts is generated from config/models.toml. If the
      # TOML changed but the generated file wasn't regenerated, the provider
      # ships stale model_ids (the #358 → #366 drift). Regenerate and fail if
      # the committed file differs.
      - run: npm run generate-models
      - name: Fail if src/generated/models.ts is stale vs config/models.toml
        run: |
          if ! git diff --quiet src/generated/models.ts; then
            echo "::error::src/generated/models.ts is out of date with config/models.toml. Run 'npm run generate-models' in sdks/ai-sdk-provider and commit the result."
            git --no-pager diff src/generated/models.ts
            exit 1
          fi
          echo "OK: generated models are up to date with config/models.toml"
