name: openclaw-provider

on:
  push:
    paths:
      - 'sdks/openclaw-provider/**'
      - 'sdks/signer-core/**'
      # Wire-format types in `crates/protocol/` are hand-mirrored by the
      # TS SDK. A change here doesn't directly run the SDK, but re-running
      # SDK CI is the cheapest way to flag "did anyone update the SDK
      # side?". Proper end-to-end wire-compat verification needs SDK
      # tests against a live gateway — tracked separately.
      - 'crates/protocol/**'
      - '.github/workflows/openclaw-provider.yml'
  pull_request:
    paths:
      - 'sdks/openclaw-provider/**'
      - 'sdks/signer-core/**'
      - 'crates/protocol/**'
      - '.github/workflows/openclaw-provider.yml'

defaults:
  run:
    working-directory: sdks/openclaw-provider

jobs:
  install:
    name: Install (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/openclaw-provider/package-lock.json
      - name: "Build signer-core dist/ (file: dep — npm doesn't auto-build)"
        working-directory: sdks/signer-core
        run: npm ci && npm run build
      - run: npm ci

  typecheck:
    name: Typecheck (production)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdks/openclaw-provider/package-lock.json
      - name: "Build signer-core dist/ (file: dep — npm doesn't auto-build)"
        working-directory: sdks/signer-core
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run typecheck

  typecheck-tests:
    name: Typecheck (tests)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdks/openclaw-provider/package-lock.json
      - name: "Build signer-core dist/ (file: dep — npm doesn't auto-build)"
        working-directory: sdks/signer-core
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run typecheck:tests

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        node: ['20']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/openclaw-provider/package-lock.json
      - name: "Build signer-core dist/ (file: dep — npm doesn't auto-build)"
        working-directory: sdks/signer-core
        run: npm ci && npm run build
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdks/openclaw-provider/package-lock.json
      - name: "Build signer-core dist/ (file: dep — npm doesn't auto-build)"
        working-directory: sdks/signer-core
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run build

  guard-install-scripts:
    name: Guard install scripts
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdks/openclaw-provider/package-lock.json
      - name: "Build signer-core dist/ (file: dep — npm doesn't auto-build)"
        working-directory: sdks/signer-core
        run: npm ci && npm run build
      - run: npm ci
      - name: Fail if any dependency has postinstall/preinstall/prepublish
        run: |
          SCRIPTS=$(npm ls --all --json 2>/dev/null | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          def check(node, path=''):
              scripts = node.get('scripts', {})
              bad = [s for s in ['postinstall','preinstall','prepublish'] if s in scripts]
              if bad:
                  print(f'{path}: {bad}')
              for name, child in node.get('dependencies', {}).items():
                  check(child, name)
          check(data)
          ")
          if [ -n "$SCRIPTS" ]; then
            echo "ERROR: unexpected install scripts found:"
            echo "$SCRIPTS"
            exit 1
          fi
          echo "OK: no unexpected install scripts"

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdks/openclaw-provider/package-lock.json
      - name: "Build signer-core dist/ (file: dep — npm doesn't auto-build)"
        working-directory: sdks/signer-core
        run: npm ci && npm run build
      - run: npm ci
      # Audit-level critical (not high) because @solana/spl-token transitively
      # pulls bigint-buffer, which has a known high-severity CVE
      # (GHSA-3gc7-fjrx-p6mg) with no upstream fix. Affects the entire Solana
      # ecosystem. Dependabot security alerts cover the high-severity gap on
      # the repo level; this job catches CRITICAL regressions in CI.
      - run: npm audit --production --audit-level=critical

  guard-deprecated-openclaw-imports:
    # OpenClaw is mid-refactor ("slim core, expand plugins" — 2026-05-13 audit).
    # The following import paths and symbols are deprecated or removed in
    # upstream OpenClaw; using them in Solvela's plugin will silently break on
    # the next OpenClaw LTS. See docs.openclaw.ai/plugins/sdk-migration.md.
    name: Guard deprecated OpenClaw imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fail on deprecated OpenClaw imports
        run: |
          set -e
          # Patterns drawn from docs.openclaw.ai/plugins/sdk-migration.md:
          #   - openclaw/plugin-sdk/compat        — deprecated barrel
          #   - openclaw/plugin-sdk/infra-runtime — deprecated barrel
          #   - openclaw/plugin-sdk/config-runtime — deprecated barrel
          #   - openclaw/extension-api            — replaced by openclaw/plugin-sdk/* subpaths
          #   - registerEmbeddedExtensionFactory  — removed in v2026.4.24,
          #     replaced by registerAgentToolResultMiddleware
          # If you intentionally need any of these, update this guard and
          # document the OpenClaw version compatibility in the import site.
          FOUND=$(grep -rEn \
            'openclaw/plugin-sdk/compat|openclaw/plugin-sdk/infra-runtime|openclaw/plugin-sdk/config-runtime|openclaw/extension-api|registerEmbeddedExtensionFactory' \
            sdks/openclaw-provider/src sdks/openclaw-provider/tests sdks/openclaw-provider/scripts 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "ERROR: deprecated OpenClaw imports detected in sdks/openclaw-provider/:"
            echo "$FOUND"
            echo ""
            echo "These import paths/symbols are deprecated or removed upstream."
            echo "See: https://docs.openclaw.ai/plugins/sdk-migration.md"
            exit 1
          fi
          echo "OK: no deprecated OpenClaw imports in sdks/openclaw-provider/"
