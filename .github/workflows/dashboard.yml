name: dashboard

on:
  push:
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard.yml'

defaults:
  run:
    working-directory: dashboard

jobs:
  install:
    name: Install (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 18 is dropped: vitest 4.x and other dev tooling import
        # `node:util.styleText`, which was added in Node 20.12. Keep in
        # lockstep with the SDK workflows (ai-sdk-provider.yml).
        node: ['20']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        node: ['20']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      # `next build` runs the TypeScript compiler over the entire app
      # tree, so this also covers typecheck. A dedicated `tsc --noEmit`
      # step would duplicate the work.
      - run: npm run build

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      # The dashboard now carries Solana deps (@solana/kit + Wallet Standard,
      # for the escrow-funding flow), but @solana/kit is the modern web3.js 2.0
      # line and pulls NO bigint-buffer, so the bigint-buffer CVE exception the
      # SDK workflows carry still doesn't apply here. `--audit-level=high`
      # remains a clean, appropriate floor for this frontend.
      - run: npm audit --production --audit-level=high
