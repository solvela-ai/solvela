[package]
name = "gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "BUSL-1.1"

[lib]
name = "gateway"
path = "src/lib.rs"

[[bin]]
name = "solvela-gateway"
path = "src/main.rs"

[dependencies]
solvela-protocol = { workspace = true }
solvela-x402 = { workspace = true, features = ["postgres"] }
solvela-router = { workspace = true }

# Web
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

# Data stores
sqlx = { workspace = true }
redis = { workspace = true }

# Semantic cache embedding (local ONNX model via fastembed → ort runtime)
fastembed = "5"

# Cache / crypto
sha2 = { workspace = true }
hmac = { workspace = true }
lru = { workspace = true }
hex = "0.4"
rand = "0.10"
zeroize = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
futures = { workspace = true }
pin-project-lite = "0.2"

# URL parsing / validation
url = { workspace = true }

# Config parsing
toml = { workspace = true }

# Environment
dotenvy = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# `test-util` (paused time via `#[tokio::test(start_paused = true)]`) is NOT in
# tokio's "full" feature set — enable it here for deterministic timeout tests.
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
ed25519-dalek = { workspace = true }
bs58 = { workspace = true }
tokio-stream = "0.1"
# OpenAPI drift guard (tests/openapi_contract.rs): validates live responses
# against docs/openapi.json (OpenAPI 3.1 schemas = JSON Schema 2020-12).
# Default features are disabled — they pull in network/file `$ref` resolution,
# which the self-contained spec never needs.
jsonschema = { version = "0.46", default-features = false }
