# --- NVIDIA ---
#
# NVIDIA NIM (https://integrate.api.nvidia.com/v1) is OpenAI-compatible. Each
# model is registered with `provider = "nvidia"` and `model_id` set to the FULL
# publisher-qualified id NVIDIA expects in the request `model` field (e.g.
# "nvidia/llama-...", "meta/llama-...", "deepseek-ai/deepseek-r1"). The canonical
# Solvela key therefore becomes "nvidia/<publisher>/<model>" — addressable by
# that canonical key or by the TOML key below. The adapter (providers/nvidia.rs)
# strips exactly one leading Solvela "nvidia/" prefix to recover the
# publisher-qualified id.
#
# Model ids verified against NVIDIA's live catalog (docs.api.nvidia.com /
# build.nvidia.com modelcards), 2026-06-17. All models are free-tier (0.0/0.0)
# except the two paid Nemotron models, whose rates are cited inline.
# Content-safety/guard/moderation/embedding/reranking models and the deprecated
# nvidia/llama-3.1-nemotron-70b-instruct are intentionally NOT registered.

