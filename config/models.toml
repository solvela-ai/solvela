# Model Registry — Solvela
# Prices are provider cost per million tokens. The platform fee is applied automatically.
#
# `context_window` is also the billing cap on provider-reported prompt tokens
# (crates/gateway/src/routes/chat/cost.rs `cap_usage_to_request_limits`), so it
# must be the provider's REAL window — understating it under-bills long prompts.
#
# Optional long-prompt tier (set all three together, see
# crates/router/src/models.rs `long_context_pricing`): a request whose prompt is
# STRICTLY GREATER than `long_context_threshold_tokens` is billed — input and
# output, whole request — at `long_context_input_cost_per_million` /
# `long_context_output_cost_per_million` instead of the base rates. Providers
# bill this way (Anthropic Haiku 5.5 over 100K prompt tokens; OpenAI GPT-6 /
# GPT-5.5 over 272K input tokens), so the registry mirrors it exactly.

