# x402 Service Marketplace Registry
# Phase 6: Registered x402-compatible services available through the gateway.
#
# Phase 6 is NOT YET IMPLEMENTED. All entries below are commented out to
# prevent health-check warnings on the deployed gateway. Uncomment and
# update endpoints when the service marketplace code is wired in.
#
# ── Internal services (served by this gateway) ──────────────────────
#
# [services.llm-gateway]
# name = "LLM Intelligence"
# endpoint = "/v1/chat/completions"
# category = "intelligence"
# x402_enabled = true
# internal = true
#
# [services.image-gen]
# name = "Image Generation"
# endpoint = "/v1/images/generations"
# category = "media"
# x402_enabled = true
# internal = true
#
# ── External services (examples — replace with real endpoints) ──────
#
# [services.weather-api]
# name = "Weather Data"
# endpoint = "https://weather.example.com/v1/forecast"   # PLACEHOLDER — do not enable
# category = "data"
# x402_enabled = true
# internal = false
# provider_fee_percent = 0
#
# [services.web-search]
# name = "Web Search"
# endpoint = "https://search.example.com/v1/query"       # PLACEHOLDER — do not enable
# category = "search"
# x402_enabled = true
# internal = false
#
# ── Vendor-settled services (settlement-platform P1) ────────────────
#
# `vendor_wallet` (optional, external services only) makes the agent pay the
# listed `price_per_request_usdc` directly to the vendor's wallet — no 5%
# fee-on-top. Solvela's 5% is recorded in spend_logs as an off-chain
# receivable against the vendor (vendor absorbs; see the
# "Vendor-Settlement Fee Mechanics" RFC, 2026-06-12). The value must be a
# valid base58 Solana pubkey; the gateway fails closed at load time otherwise.
#
# [services.vendor-data-api]
# name = "Vendor Data API"
# endpoint = "https://api.vendor.example.com/v1/data"    # PLACEHOLDER — do not enable
# category = "data"
# x402_enabled = true
# internal = false
# price_per_request_usdc = 0.02
# vendor_wallet = "9WzDXwBbmkg8ZTbNMqUxvQRAyrZzDsGYdLVL9zYtAWWM"  # PLACEHOLDER
