# cargo-audit configuration
# https://docs.rs/cargo-audit/latest/cargo_audit/

[advisories]
# Ignore advisories that are known to be unreachable in our build.
# Each entry MUST include a notes block in this file's comments
# explaining why the advisory does not affect us, and how to verify
# the unreachability claim.
ignore = [
    # RUSTSEC-2023-0071 — Marvin Attack timing sidechannel in `rsa 0.9.x`.
    #
    # Path: rsa <- sqlx-mysql <- sqlx-macros-core <- sqlx-macros <- sqlx
    #
    # We use sqlx with `default-features = false, features = ["postgres", ...]`
    # (see workspace Cargo.toml). `sqlx-macros-core 0.8.6` declares
    # `sqlx-mysql` as an OPTIONAL dependency (gated behind the `mysql`
    # feature, which we do not enable). cargo-audit reads `Cargo.lock`
    # without applying feature gates, so it reports `sqlx-mysql` (and
    # transitively `rsa`) as present even though they are never compiled.
    #
    # Verify: `find target/{debug,release}/deps -name '*sqlx_mysql*'` is
    # empty in any of our builds. No `rsa` symbol appears in the gateway
    # binary.
    #
    # If sqlx upstream stops listing `sqlx-mysql` unconditionally in
    # `sqlx-macros-core`'s deps block (or releases an `rsa` upgrade),
    # remove this ignore.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0459 — C SQLite CVE-2026-119375 in `libsqlite3-sys < 0.39.0`.
    #
    # Path: libsqlite3-sys <- sqlx-sqlite <- sqlx-macros-core <- sqlx-macros <- sqlx
    #
    # Same shape as RUSTSEC-2023-0071 above: the workspace uses sqlx with
    # `default-features = false, features = ["postgres", ...]` (see workspace
    # Cargo.toml), so the `sqlite` driver — and the bundled SQLite C library
    # with it — is an OPTIONAL dependency that is never compiled.
    # cargo-audit reads `Cargo.lock` without feature gates, so it lists
    # `sqlx-sqlite`/`libsqlite3-sys` even though neither is in the built
    # graph. `cargo deny check` (feature-aware) does not report it.
    #
    # Verify: `cargo tree -i libsqlite3-sys` and `cargo tree -i sqlx-sqlite`
    # print nothing; `find target -name '*sqlx_sqlite*' -o -name '*libsqlite3*'`
    # is empty; no SQLite symbol appears in the gateway binary.
    #
    # The advisory's fix (libsqlite3-sys >= 0.39.0) is a major jump that only
    # a future sqlx release can carry; sqlx 0.9.0 is the latest available and
    # there is no newer 0.9.x. Remove this ignore when sqlx ships a
    # `sqlx-sqlite` using libsqlite3-sys >= 0.39, or if the workspace ever
    # enables the sqlite feature.
    "RUSTSEC-2026-0459",
]
