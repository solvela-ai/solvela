# cargo-audit configuration
# https://docs.rs/cargo-audit/latest/cargo_audit/

[advisories]
# Ignore advisories that are known to be unreachable in our build.
# Each entry MUST include a notes block in this file's comments
# explaining why the advisory does not affect us, and how to verify
# the unreachability claim.
ignore = [
    # RUSTSEC-2023-0071 — Marvin Attack timing sidechannel in `rsa 0.9.x`.
    #
    # Path: rsa <- sqlx-mysql <- sqlx-macros-core <- sqlx-macros <- sqlx
    #
    # We use sqlx with `default-features = false, features = ["postgres", ...]`
    # (see workspace Cargo.toml). `sqlx-macros-core 0.8.6` declares
    # `sqlx-mysql` as an OPTIONAL dependency (gated behind the `mysql`
    # feature, which we do not enable). cargo-audit reads `Cargo.lock`
    # without applying feature gates, so it reports `sqlx-mysql` (and
    # transitively `rsa`) as present even though they are never compiled.
    #
    # Verify: `find target/{debug,release}/deps -name '*sqlx_mysql*'` is
    # empty in any of our builds. No `rsa` symbol appears in the gateway
    # binary.
    #
    # If sqlx upstream stops listing `sqlx-mysql` unconditionally in
    # `sqlx-macros-core`'s deps block (or releases an `rsa` upgrade),
    # remove this ignore.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0459 — `libsqlite3-sys` via the C SQLite CVE-2026-119375
    # (medium, CVSS 6.8).
    #
    # Path: libsqlite3-sys <- sqlx-sqlite <- sqlx-macros-core <- sqlx
    #
    # `sqlx-sqlite` is an OPTIONAL dependency of `sqlx-macros-core` gated
    # behind the `sqlite` feature, which the workspace never enables: sqlx
    # is configured as `default-features = false, features = ["runtime-tokio",
    # "postgres", "chrono", "uuid", "macros", "migrate"]` (see workspace
    # Cargo.toml), and no crate in the workspace selects `sqlite`. cargo-audit
    # reads `Cargo.lock` without applying feature gates, so it reports the
    # lock entry even though no compiled artifact links SQLite.
    #
    # Verify: `cargo tree --workspace -i libsqlite3-sys` (with and without
    # `--all-features`) prints "nothing to print" — the crate is not in the
    # feature-resolved graph of any workspace member. No `libsqlite3_sys` or
    # `sqlx_sqlite` object appears under `target/`.
    #
    # Remove this ignore once a sqlx release requires `libsqlite3-sys >=
    # 0.39.0` (the advisory's patched floor) and `cargo update` lifts the
    # lock entry; as of sqlx 0.9.0 it requires `>=0.30.1, <0.38.0`.
    "RUSTSEC-2026-0459",
]
