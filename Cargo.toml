[workspace]
resolver = "2"
members = [
    "crates/gateway",
    "crates/x402",
    "crates/escrow-tx",
    "crates/router",
    "crates/cli",
    "crates/protocol",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
# Minimum supported Rust version. Driven by sqlx 0.9, which requires rustc 1.94.
# Only the gateway binary opts in (`rust-version.workspace = true`); the published
# Apache-2.0 libs (protocol/x402/router/cli) deliberately do not, so their crates.io
# MSRV isn't over-claimed. Keep this <= the Docker builder pin in ../Dockerfile so a
# future dep MSRV bump fails consistently in CI and Docker rather than slipping
# through as a Docker-only failure.
rust-version = "1.94"
# Note: each crate declares its own `license = "..."` explicitly. The gateway is
# BUSL-1.1 (commercial use restricted, see ../LICENSE). The protocol, x402, router,
# and cli crates are Apache-2.0 (../LICENSE-APACHE) so the rest of the ecosystem can
# reuse them freely, with an explicit patent grant. SDKs (sdks/*) are also Apache-2.0.
repository = "https://github.com/solvela-ai/solvela"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Web framework
axum = "0.8"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "limit", "set-header", "catch-panic"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Crypto
base64 = "0.22"
bs58 = "0.5"
bincode = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc"] }

# Data stores
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros", "migrate"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hmac = "0.13"
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Security
zeroize = { version = "1", features = ["derive"] }
lru = "0.18"

# URL parsing
url = "2"

# Environment
dotenvy = "0.15"

# Workspace crates
# Path + version dual-spec: `path` lets local dev resolve to the in-tree code;
# `version` is required by crates.io at publish time so consumers get the
# published artifact when they pull from the registry.
solvela-x402 = { path = "crates/x402", version = "0.2" }           # renamed from `x402` — that name is taken on crates.io
solvela-escrow-tx = { path = "crates/escrow-tx", version = "0.2" } # no-deps escrow deposit-tx builder, shared with the Rust SDK
solvela-router = { path = "crates/router", version = "0.2" }
solvela-protocol = { path = "crates/protocol", version = "0.4" }
