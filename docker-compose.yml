# Solvela local development stack
#
# Services:
#   postgres  — spend logs, wallet budgets
#   redis     — response cache, rate limiting, replay protection
#
# Usage:
#   docker compose up -d          # start in background
#   docker compose down           # stop
#   docker compose down -v        # stop + delete volumes (full reset)
#
# Migrations in migrations/ are applied automatically on first start.
# DATABASE_URL=postgres://solvela:solvela_dev_password@localhost:5432/solvela
# REDIS_URL=redis://localhost:6379

services:
  postgres:
    image: postgres:16-alpine
    container_name: solvela_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: solvela
      # WARNING: Default credentials — for local development only. Never use in production.
      POSTGRES_PASSWORD: solvela_dev_password
      POSTGRES_DB: solvela
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # SQL files in migrations/ are run in filename order on first start
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solvela -d solvela"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # redis-stack-server bundles the RediSearch module the semantic cache needs
    # for FT.CREATE / FT.SEARCH KNN. Pinned to the tag confirmed working in the
    # semantic-cache PoC. The stack image ignores a bare `command:` override, so
    # server flags are passed via the REDIS_ARGS env var (its documented escape
    # hatch).
    image: redis/redis-stack-server:7.4.0-v3
    container_name: solvela_redis
    restart: unless-stopped
    # LRU eviction when memory limit is hit; no RDB persistence (cache is ephemeral)
    environment:
      REDIS_ARGS: "--maxmemory 256mb --maxmemory-policy allkeys-lru --save ''"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
