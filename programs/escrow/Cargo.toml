# Opt out of the parent Cargo workspace to avoid dependency version conflicts:
# - thiserror: workspace uses "2", anchor-lang requires "^1"
# - base64: workspace uses "0.22", anchor requires "^0.21"
# Build with: cargo check --lib  (type checking)
#             anchor build        (full compile + IDL generation, needs Anchor CLI)
[workspace]

[package]
name = "solvela-escrow"
version = "0.1.0"
edition = "2021"
description = "Anchor escrow program for Solvela USDC-SPL payments"
license = "MIT"
repository = "https://github.com/solvela-ai/solvela"
authors = ["Solvela Contributors"]

# This crate is NOT a member of the workspace root. Anchor programs require
# their own Cargo.lock (managed by `anchor build`) and pin dependency versions
# that conflict with the gateway workspace (thiserror ^1 vs ^2, base64 ^0.21
# vs ^0.22). Build with `anchor build` or `cargo check --lib` here.

[lib]
crate-type = ["cdylib", "lib"]
name = "solvela_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Selects the mainnet USDC mint (EPjFW…) at compile time. Without this,
# the program targets the devnet USDC mint (4zMM…). The deployed bytecode
# at the program ID in lib.rs MUST be built with `--features mainnet` —
# default builds (e.g. `cargo check --lib`, local-validator tests) target
# devnet so the same source compiles for both environments without edits.
mainnet = []
# Enables the LiteSVM integration tests in tests/integration.rs and
# tests/helpers.rs. Requires `anchor build` to have produced
# target/deploy/solvela_escrow.so first; without this feature the
# integration test files compile to empty crates so `cargo test` works
# from a fresh checkout (unit tests in tests/unit.rs always run).
sbf = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["associated_token", "token"] }

[dev-dependencies]
anchor-lang = { version = "0.31.1" }
# LiteSVM for fast in-process Solana program unit tests
# Requires anchor build to produce a .so first; tests skip gracefully without it
litesvm = "0.12.0"
solana-sdk = "2.2"
spl-token = "7"
spl-associated-token-account = "6"

[profile.release]
overflow-checks = true

# Whitelist cfg values that anchor-lang's macros emit but our crate does not
# declare as features. Without this, rustc's check-cfg lint warns 14 times on
# every `#[program]` / `#[derive(Accounts)]` expansion. Tracks #114 and
# upstream Anchor macro check-cfg hygiene — the macro crates still embed
# these cfgs without check-cfg metadata as of 1.0.2, so an anchor-lang bump
# would not actually clear the warnings.
#
# - feature = "anchor-debug" / "custom-heap" / "custom-panic": Anchor
#   internal opt-in features we never enable.
# - target_os = "solana": the SBF on-chain target triple, only set under
#   `anchor build`. Host-side `cargo check` doesn't see it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
    'cfg(target_os, values("solana"))',
] }
