[toolchain]
anchor_version = "0.31.1"

[features]
seeds = true
skip-lint = false

# Cluster policy (issue #120 path A): each cluster has its own program ID,
# selected at compile time by declare_id! in src/lib.rs.
# - mainnet (DEFAULT build): 9neDHouXgEgHZDde5SpmqqEZ9Uv35hFcjtFEPxomtHLU.
#   Unchanged — a build without the `devnet` feature is byte-identical to
#   the pre-#120 mainnet-only artifact.
# - devnet (first-class rehearsal target): build with `--features devnet`
#   to declare GyJRAC46bDoBQJNzTnbupWj8T62GipFKnizHExLXPwvo. The devnet
#   program keypair is operator-held and never committed to this repo.
# - localnet: intentionally absent — LiteSVM covers local testing
#   (programs/escrow/tests/integration.rs), so `anchor deploy
#   --provider.cluster localnet` fails fast with "program not found"
#   instead of silently targeting a real cluster's ID.

[programs.mainnet]
solvela_escrow = "9neDHouXgEgHZDde5SpmqqEZ9Uv35hFcjtFEPxomtHLU"

[programs.devnet]
solvela_escrow = "GyJRAC46bDoBQJNzTnbupWj8T62GipFKnizHExLXPwvo"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test --lib"
